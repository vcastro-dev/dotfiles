# Prefix mais ergonômico
set -g prefix C-a
unbind C-b
bind C-a send-prefix

# Navegação entre painéis com Alt + seta
bind -n M-Left select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up select-pane -U
bind -n M-Down select-pane -D

# Dividir painéis
bind -n M-| split-window -h
bind -n M-- split-window -v

# Aparência minimalista
set -g status-style 'fg=colour243'
set -g pane-border-style 'fg=colour238'
set -g pane-active-border-style 'fg=colour33'

# Zero delay para o Neovim
set -sg escape-time 0

# Bash com login para ler o .bashrc
set-option -g default-command "bash --login"
